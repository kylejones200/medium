data:
  source: "data/amtrak_ridership_time_series_data.csv"
  entity_column: "Station"
  time_column: "Year"
  value_column: "Ridership"
  generate_synthetic: false
  n_entities: 20
  n_periods: 10
  seed: 42

model:
  features: []
  entity_fixed_effects: true
  time_fixed_effects: true

output:
  figures_dir: "images"
  figure_format: "png"
  figure_dpi: 100

