data:
  source: "fred"
  series:
    UNRATE: "UNRATE"
    CIVPART: "CIVPART"
    CPIAUCSL: "CPIAUCSL"
  start_date: "2017-09-01"
  end_date: "2022-12-31"
  cpi_start_date: "2016-09-01"

analysis:
  cutoff_date: "2020-03-01"
  bandwidth: 30
  bandwidth_sensitivity:
    - 6
    - 12
  placebo_cutoff: "2019-01-01"
  outcomes:
    - name: "UNRATE"
      description: "Unemployment Rate"
      ylabel: "Unemployment Rate (%)"
      ylim_zero: true
    - name: "Inflation"
      description: "Inflation Rate"
      ylabel: "Inflation Rate (YoY, %)"
      ylim_zero: false
    - name: "CIVPART"
      description: "Labor Force Participation"
      ylabel: "Labor Force Participation Rate (%)"
      ylim_zero: false

output:
  figures_dir: "images"
  figure_format: "png"
  figure_dpi: 100

