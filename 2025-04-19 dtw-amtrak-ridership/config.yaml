data:
  source: "data/amtrak_ridership_time_series_data.csv"
  station_column: "Station"
  time_column: "Year"
  value_column: "Ridership"
  generate_synthetic: false
  n_stations: 15
  n_periods: 20
  seed: 42

analysis:
  target_station: "Lincoln, Nebraska"
  n_similar: 5
  save_dtw_matrix: true

output:
  figures_dir: "images"
  figure_format: "png"
  figure_dpi: 100

